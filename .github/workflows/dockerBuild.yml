name: BUILD WAR STORE TOMCAT and BUILD DOCKER IMAGE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR File
        run: mvn clean package

      - name: Build Docker Image
        run: docker build -t Java-Repo-Project6-Docker-Image:latest .

      - name: Check Docker Image
        run: docker images